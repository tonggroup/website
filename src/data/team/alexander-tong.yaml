bio: >
  Alexander Tong is a Principal Investigator at Aithyra, a research institute at
  the intersection of machine learning and life sciences led by Michael
  Bronstein and funded by the Boehringer Ingelheim Foundation. He works on
  generative modeling, deep learning, and optimal transport, with applications
  to cell and molecular biology. Previously, he was an assistant professor at
  Duke University and a postdoc at Mila with Yoshua Bengio. He received his PhD
  from Yale University in 2021, advised by Smita Krishnaswamy.
