[build]
  command = "pnpm install && pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/404"
  status = 404

# Create HTTP/2 server push for critical assets
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/posts/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/research/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/team/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/publications/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
